<!doctype html>
<!-- The root's background is what rubber-band overscroll exposes past either end
     of the page. Both bands are navy pinstripes, so painting the canvas the same
     makes the bounce read as the header/footer stretching, not the page lifting
     off a white void. The stripes share origin and period with the bands, so
     they line up. -->
<html lang="es-AR" class="bg-primary pinstripes">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>La Papeinliga</title>
    <meta name="description" content="Fechas, equipos, estadísticas y fotos de La Papeinliga." />
    <meta name="theme-color" content="#1a2c4c" />

    <!-- ?v= busts the browser icon cache, which reloads do not clear: Firefox keeps
         favicons in places.sqlite for weeks and only refetches when the URL changes.
         Bump it whenever the icon files change, or returning visitors keep the old one. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="La Papeinliga" />
    <meta property="og:title" content="La Papeinliga" />
    <meta property="og:description" content="Fechas, equipos, estadísticas y fotos de La Papeinliga." />
    <meta property="og:url" content="https://lapapeinliga.club/" />
    <meta property="og:image" content="https://lapapeinliga.club/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- crossorigin: the share-image capture reads this stylesheet's rules to
         embed the fonts, which a no-CORS stylesheet forbids. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..800&family=Graduate&display=swap"
      rel="stylesheet"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="root">
      <!-- The launch frame: the header band as plain HTML, at the size and
           position the app's own header takes, so the first paint already
           looks like the app and the header lands on the same pixels once
           React mounts and replaces this. The classes are Tailwind's,
           compiled from this file like the ones on <html>. The invisible tab
           holds the nav row's height; the tabs themselves arrive with React,
           whose icons cannot be drawn here. -->
      <div class="min-h-dvh bg-canvas text-on-surface flex flex-col">
        <header class="bg-primary pinstripes text-on-primary">
          <div class="max-w-2xl mx-auto px-4 pt-5 sm:pt-7">
            <div class="flex items-center gap-2.5 sm:gap-3.5">
              <img src="/src/assets/crest-on-dark.png" alt="" class="w-11 h-11 sm:w-14 sm:h-14 shrink-0" />
              <span class="font-display text-xl sm:text-3xl uppercase tracking-wide">La Papeinliga</span>
            </div>
            <div class="mt-4 sm:mt-5 w-fit text-sm sm:text-base font-semibold pb-2.5 sm:pb-3 border-b-[3px] border-transparent invisible">Fechas</div>
          </div>
        </header>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
